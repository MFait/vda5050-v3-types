[package]
name = "vda5050-v3-types"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Transport-independent VDA 5050 v3.0.0 message types"
readme = "README.md"
keywords = ["vda5050", "robotics", "agv"]
categories = ["data-structures"]
repository = "https://github.com/MFait/vda5050-v3-types"

exclude = [
    "/.github/**",
    "/docs/**",
    "/scripts/**",
]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "serde"
required-features = ["serde"]

[[example]]
name = "json"
required-features = ["json"]

[[example]]
name = "topic"
required-features = ["topic"]

[[example]]
name = "topic_serde"
required-features = ["topic", "serde"]

[[example]]
name = "topic_json"
required-features = ["topic", "json"]

[features]
default = []
serde = ["dep:serde"]
json = ["serde"]
topic = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
